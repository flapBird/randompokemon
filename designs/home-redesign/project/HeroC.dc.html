<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero C — Type Spectrum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
a { color: #526057; text-decoration: none; }
a:hover { color: #172019; }
</style>
</helmet>

<div style="width: 1440px; height: 720px; box-sizing: border-box; background: #f6f7f3; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
  <header style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 76px; padding: 0 44px; border-bottom: 1px solid #e2e7e0;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 11px; font-weight: 800; font-size: 17px; letter-spacing: -0.03em; color: #172019;">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="12.5" fill="#fff" stroke="#172019" stroke-width="2.4"/>
        <path d="M1.5 14 h9 M17.5 14 h9" stroke="#172019" stroke-width="2.4"/>
        <path d="M1.8 12.6 A12.5 12.5 0 0 1 26.2 12.6 L17.6 13.4 A4.4 4.4 0 0 0 10.4 13.4 Z" fill="#e85d43" stroke="#172019" stroke-width="1.6"/>
        <circle cx="14" cy="14" r="3.4" fill="#fff" stroke="#172019" stroke-width="2"/>
      </svg>
      Random<span style="color: #c94731;">Pokémon</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 6px;" aria-label="Main">
      <a href="#" style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #c94731;">Random Generator</a>
      <a href="#" style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700;">Tools ▾</a>
      <a href="#" style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700;">Generators ▾</a>
      <a href="#" style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700;">Pokédex ▾</a>
      <a href="#" style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700;">Guides</a>
      <button type="button" aria-label="Toggle dark mode" style="width: 42px; height: 42px; margin-left: 8px; display: inline-grid; place-items: center; border: 1px solid #dce1da; border-radius: 12px; background: #ffffff; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M15.5 11.2 A7 7 0 1 1 6.8 2.5 A5.6 5.6 0 0 0 15.5 11.2 Z" fill="none" stroke="#172019" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </header>

  <!-- Hero -->
  <main style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 60px 28px;">
    <span style="color: #c94731; font-size: 12px; font-weight: 800; letter-spacing: 0.18em;">THE WHOLE POOL, ONE COLOR EACH</span>
    <h1 style="margin: 16px 0 12px; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 104px; line-height: 0.95; letter-spacing: -0.045em; color: #172019;">
      Random Pokémon <em style="color: #e85d43; font-weight: 500;">Generator</em>
    </h1>
    <p style="margin: 0 0 28px; color: #526057; font-size: 19px; line-height: 1.5; max-width: 700px;">
      Roll one Pokémon or a full team of six. Lock your favorites, reroll the rest, share the exact result.
    </p>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button type="button" style="min-height: 56px; padding: 14px 30px; border: 0; border-radius: 13px; background: #e85d43; color: #172019; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 22px rgba(232,93,67,0.28);">Generate a team</button>
      <button type="button" style="min-height: 56px; padding: 14px 26px; border: 1px solid #dce1da; border-radius: 13px; background: #ffffff; color: #172019; font-size: 16px; font-weight: 750; cursor: pointer;">Browse the Pokédex</button>
    </div>

    <!-- Stats -->
    <div style="display: flex; align-items: stretch; gap: 0; margin-top: 36px;">
      <div style="padding: 0 44px; border-right: 1px solid #dce1da;">
        <div style="font-family: Georgia, serif; font-weight: 500; font-size: 44px; line-height: 1; color: #172019;">1,025</div>
        <div style="margin-top: 6px; color: #526057; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;">SPECIES</div>
      </div>
      <div style="padding: 0 44px; border-right: 1px solid #dce1da;">
        <div style="font-family: Georgia, serif; font-weight: 500; font-size: 44px; line-height: 1; color: #172019;">18</div>
        <div style="margin-top: 6px; color: #526057; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;">TYPES</div>
      </div>
      <div style="padding: 0 44px;">
        <div style="font-family: Georgia, serif; font-weight: 500; font-size: 44px; line-height: 1; color: #172019;">9</div>
        <div style="margin-top: 6px; color: #526057; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;">REGIONS</div>
      </div>
    </div>
  </main>

  <!-- Full-bleed type spectrum band -->
  <div aria-hidden="true" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); height: 76px;">
    <span style="background: #8c8f86; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #d8583b; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #397cc1; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #c69000; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #4d8e4e; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #49979f; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #b43f42; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #90509f; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #aa7436; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #677db4; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #d44d78; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #738516; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #8f7a45; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #665b95; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #5e55ad; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #5d514a; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #607d88; border-top: 1px solid #f6f7f3; border-left: 1px solid #f6f7f3;"></span>
    <span style="background: #c25c99; border-top: 1px solid #f6f7f3;"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
